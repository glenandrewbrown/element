<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Element — Edit mode (reference)</title>
  <style>
    :root {
      --canvas: #1e1e22;
      --panel: #222226;
      --surface: #252529;
      --text: #e5e5ea;
      --muted: #8e8e93;
      --gen: #4a90d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--canvas);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      grid-template-rows: 40px 1fr 28px;
      grid-template-areas:
        "l t r"
        "l c r"
        "l b r";
    }
    header.toolbar {
      grid-area: t;
      background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    aside.left {
      grid-area: l;
      background: var(--panel);
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 12px;
      font-size: 10px;
      color: var(--muted);
    }
    aside.right {
      grid-area: r;
      background: var(--panel);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 12px;
      font-size: 10px;
      color: var(--muted);
    }
    main.canvas {
      grid-area: c;
      background: var(--canvas);
      position: relative;
      box-shadow: inset 2px 2px 8px rgba(0,0,0,0.35);
    }
    .fake-node {
      position: absolute;
      left: 28%;
      top: 32%;
      width: 140px;
      height: 72px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: -2px -2px 8px rgba(255,255,255,0.04), 2px 2px 8px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--gen);
    }
    footer.status {
      grid-area: b;
      background: var(--panel);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 10px;
      color: var(--muted);
    }
    h1 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="toolbar">EDIT · BOARD · BPM 120</header>
  <aside class="left">
    <h1>Palette</h1>
    <div style="height:8px;background:var(--surface);border-radius:4px;margin-bottom:8px;box-shadow:inset 2px 2px 6px rgba(0,0,0,0.4);"></div>
    <div style="height:8px;background:var(--surface);border-radius:4px;margin-bottom:8px;"></div>
    <div style="height:8px;background:var(--surface);border-radius:4px;"></div>
  </aside>
  <main class="canvas">
    <div class="fake-node">Block</div>
  </main>
  <aside class="right">
    <h1>Inspector</h1>
    <p>Reference only — see live <code>InspectorHub.tsx</code>.</p>
  </aside>
  <footer class="status">Zoom · Snap · Minimap</footer>
</body>
</html>
